<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FURL · 短链签发台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161A'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='%23FFB627' text-anchor='middle'%3Ef%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
  /* ============ 设计令牌：翻牌显示盘（split-flap departure board） ============ */
  :root {
    --bg: #14161A;
    --bg-raised: #1B1E24;
    --bg-board: #1F232B;
    --bg-inset: #101216;
    --line: #2A2E38;
    --line-strong: #3A3F4C;
    --ink: #E9ECF2;
    --ink-dim: #9AA2B1;
    --ink-faint: #646C7A;
    --amber: #FFB627;
    --amber-soft: rgba(255,182,39,.12);
    --green: #3ECF8E;
    --green-soft: rgba(62,207,142,.12);
    --red: #FF5C5C;
    --red-soft: rgba(255,92,92,.12);
    --blue: #6FA8FF;
    --blue-soft: rgba(111,168,255,.12);
    --shadow-pop: 0 24px 60px -18px rgba(0,0,0,.65);
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: 'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --font-body: 'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }
  [data-theme="light"] {
    --bg: #EEF0F4;
    --bg-raised: #FFFFFF;
    --bg-board: #F7F8FA;
    --bg-inset: #E4E7EC;
    --line: #D8DCE3;
    --line-strong: #C2C7D1;
    --ink: #1A1D23;
    --ink-dim: #5B6270;
    --ink-faint: #9AA0AC;
    --amber: #B87400;
    --amber-soft: rgba(184,116,0,.10);
    --green: #0E9F6E;
    --green-soft: rgba(14,159,110,.10);
    --red: #E02D2D;
    --red-soft: rgba(224,45,45,.09);
    --blue: #2E6FE8;
    --blue-soft: rgba(46,111,232,.09);
    --shadow-pop: 0 24px 50px -20px rgba(23,28,40,.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    transition: background .35s ease, color .35s ease;
    font-size: 15px;
    line-height: 1.55;
  }
  ::selection { background: var(--amber); color: #14161A; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  .mono { font-family: var(--font-mono); }

  /* ============ 登录 ============ */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden;
  }
  .login-screen::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(560px 280px at 50% -8%, var(--amber-soft), transparent 70%),
      repeating-linear-gradient(90deg, transparent 0 79px, var(--line) 79px 80px);
    opacity: .5; pointer-events: none;
  }
  .login-card {
    position: relative; width: 100%; max-width: 400px;
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 20px; padding: 44px 40px 40px; box-shadow: var(--shadow-pop);
    animation: riseIn .55s cubic-bezier(.22,.9,.36,1) both;
  }
  .login-mark {
    width: 52px; height: 52px; border-radius: 13px; margin: 0 auto 22px;
    background: var(--bg-inset); border: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 24px; color: var(--amber);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .login-card h1 {
    font-size: 22px; font-weight: 600; text-align: center; letter-spacing: .02em;
  }
  .login-card .sub {
    text-align: center; color: var(--ink-dim); font-size: 13px; margin: 6px 0 30px;
    font-family: var(--font-mono); letter-spacing: .08em;
  }
  .login-error {
    display: none; color: var(--red); font-size: 13px; margin: -6px 0 12px;
    padding: 9px 12px; border-radius: var(--radius-sm); background: var(--red-soft);
    border: 1px solid rgba(255,92,92,.25);
  }
  .login-error.show { display: block; animation: shake .35s ease; }

  /* ============ 表单基础 ============ */
  .field label {
    display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
    margin-bottom: 8px;
  }
  input[type="text"], input[type="password"], input[type="number"], textarea {
    width: 100%; padding: 12px 14px; background: var(--bg-inset);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    color: var(--ink); font-size: 14.5px; font-family: var(--font-body);
    outline: none; transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  input:focus, textarea:focus {
    border-color: var(--amber);
    box-shadow: 0 0 0 3px var(--amber-soft);
  }
  input::placeholder, textarea::placeholder { color: var(--ink-faint); }
  textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
  input[type="number"] { font-family: var(--font-mono); }

  /* ============ 按钮体系 ============ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; border: 1px solid transparent; border-radius: var(--radius-sm);
    font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .12s ease, background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
    white-space: nowrap; user-select: none;
  }
  .btn:active { transform: scale(.965); }
  .toolbar > .btn, .seg, .search { flex-shrink: 0; }
  .btn:focus-visible, input:focus-visible, .tab:focus-visible, .seg-btn:focus-visible,
  .chip:focus-visible, .icon-btn:focus-visible, .type-opt:focus-visible {
    outline: 2px solid var(--amber); outline-offset: 2px;
  }
  .btn-primary {
    background: var(--amber); color: #14161A; box-shadow: 0 6px 18px -6px rgba(255,182,39,.45);
  }
  .btn-primary:hover { filter: brightness(1.06); box-shadow: 0 8px 22px -6px rgba(255,182,39,.55); }
  .btn-ghost { background: transparent; border-color: var(--line-strong); color: var(--ink-dim); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-faint); background: var(--bg-raised); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { filter: brightness(1.08); }
  .btn-danger-ghost { background: transparent; border-color: rgba(255,92,92,.4); color: var(--red); }
  .btn-danger-ghost:hover { background: var(--red-soft); border-color: var(--red); }
  .btn-block { width: 100%; padding: 13px; font-size: 15px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--ink-faint); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .16s ease;
  }
  .icon-btn:hover { color: var(--ink); background: var(--bg-inset); border-color: var(--line); }
  .icon-btn.danger:hover { color: var(--red); background: var(--red-soft); border-color: rgba(255,92,92,.3); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* PLACEHOLDER-CSS-1 */
  /* ============ 应用骨架 ============ */
  .app { display: none; max-width: 1180px; margin: 0 auto; padding: 0 28px 80px; }
  .app.active { display: block; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 0 20px; border-bottom: 1px solid var(--line); gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
    background: var(--bg-inset); border: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 19px; color: var(--amber);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.28);
  }
  .brand-name { font-size: 19px; font-weight: 700; letter-spacing: .03em; line-height: 1.1; }
  .brand-sub {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .22em;
    color: var(--ink-faint); text-transform: uppercase; margin-top: 2px;
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .clock {
    font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--amber);
    background: var(--bg-inset); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: var(--radius-sm); letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  .clock .tz { color: var(--ink-faint); font-size: 10px; margin-left: 6px; }

  /* ============ 标签页 ============ */
  .tabs {
    display: flex; gap: 4px; margin: 26px 0 28px; padding: 4px;
    background: var(--bg-inset); border: 1px solid var(--line); border-radius: 12px;
    width: fit-content; max-width: 100%;
  }
  .tab {
    padding: 9px 22px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 600;
    color: var(--ink-dim); background: transparent; border: none; font-family: var(--font-body);
    transition: all .18s ease; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--bg-raised); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  [data-theme="light"] .tab.active { box-shadow: 0 2px 8px rgba(23,28,40,.10); }

  .view { display: none; animation: riseIn .4s cubic-bezier(.22,.9,.36,1) both; }
  .view.active { display: block; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .section-title { font-size: 24px; font-weight: 700; letter-spacing: .01em; }
  .section-note { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); letter-spacing: .08em; }

  /* ============ 创建面板 ============ */
  .panel-card {
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 30px; position: relative;
  }
  .panel-card::before {
    content: ''; position: absolute; top: -1px; left: 24px; right: 24px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent); opacity: .5;
  }
  .type-switch { display: flex; gap: 12px; margin-bottom: 22px; }
  .type-opt {
    flex: 1; padding: 15px 16px; border-radius: var(--radius-sm); cursor: pointer;
    background: var(--bg-inset); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; transition: all .18s ease; color: var(--ink-dim);
  }
  .type-opt:hover { border-color: var(--line-strong); color: var(--ink); }
  .type-opt.active { border-color: var(--amber); background: var(--amber-soft); color: var(--ink); }
  .type-opt svg { width: 20px; height: 20px; flex-shrink: 0; }
  .type-opt.active svg { color: var(--amber); }
  .type-opt .t-name { font-size: 14px; font-weight: 600; }
  .type-opt .t-hint { font-size: 11.5px; color: var(--ink-faint); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { margin-bottom: 18px; }

  .expire-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 12.5px; font-weight: 500;
    background: var(--bg-inset); border: 1px solid var(--line); color: var(--ink-dim);
    font-family: var(--font-body); transition: all .16s ease;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .chip.active { background: var(--amber); border-color: var(--amber); color: #14161A; font-weight: 600; }
  .expire-custom { display: none; margin-top: 10px; }
  .expire-custom.show { display: block; animation: riseIn .25s ease both; }

  /* ============ 创建结果：翻牌揭晓 ============ */
  .issue-result {
    display: none; margin-top: 24px; padding: 24px;
    background: var(--bg-inset); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .issue-result.show { display: block; animation: riseIn .35s ease both; }
  .issue-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em;
    color: var(--green); text-transform: uppercase;
  }
  .flap-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .flap {
    width: 46px; height: 58px; border-radius: 8px; perspective: 300px;
    background: var(--bg-board); border: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 26px; font-weight: 700; color: var(--amber);
    position: relative; overflow: hidden;
    box-shadow: inset 0 -10px 14px -10px rgba(0,0,0,.5), 0 3px 8px -2px rgba(0,0,0,.4);
    animation: flapIn .5s cubic-bezier(.3,1.4,.5,1) both;
  }
  .flap::before, .flap::after {
    content: ''; position: absolute; left: 0; right: 0; height: 1px; background: rgba(0,0,0,.45);
  }
  .flap::before { top: 50%; } .flap::after { top: calc(50% + 1px); background: rgba(255,255,255,.06); }
  @keyframes flapIn {
    0% { transform: rotateX(90deg); opacity: 0; }
    60% { transform: rotateX(-12deg); opacity: 1; }
    100% { transform: rotateX(0); }
  }
  .result-link { display: flex; gap: 10px; margin-bottom: 18px; }
  .result-link input { flex: 1; font-family: var(--font-mono); font-size: 13.5px; }
  .qr-wrap {
    display: flex; justify-content: center; padding: 14px; background: #fff;
    border-radius: var(--radius-sm); width: fit-content; margin: 0 auto;
  }
  /* PLACEHOLDER-CSS-2 */
  /* ============ 列表：摘要条 / 工具栏 / 筛选 ============ */
  .summary-strip {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px;
  }
  .sum-item {
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 14px 18px; display: flex; align-items: baseline; gap: 10px;
    transition: border-color .18s ease;
  }
  .sum-item:hover { border-color: var(--line-strong); }
  .sum-item .k { font-size: 12px; color: var(--ink-faint); }
  .sum-item .v {
    font-family: var(--font-mono); font-size: 22px; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .sum-item .v.green { color: var(--green); }
  .sum-item .v.red { color: var(--red); }

  .toolbar {
    display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
  }
  .search { flex: 1; min-width: 220px; position: relative; }
  .search svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--ink-faint); pointer-events: none;
  }
  .search input { padding-left: 36px; }

  .seg {
    display: flex; gap: 3px; padding: 3px; background: var(--bg-inset);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .seg-btn {
    padding: 7px 14px; border-radius: 8px; border: none; background: transparent; cursor: pointer;
    font-size: 12.5px; font-weight: 500; color: var(--ink-dim); font-family: var(--font-body);
    display: flex; align-items: center; gap: 6px; transition: all .16s ease; white-space: nowrap;
  }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn.active { background: var(--bg-raised); color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .seg-btn .n {
    font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 99px;
    background: var(--bg-inset); color: var(--ink-faint); font-variant-numeric: tabular-nums;
  }
  .seg-btn.active .n { background: var(--amber-soft); color: var(--amber); }
  .seg-btn[data-filter="expired"].active { color: var(--red); }
  .seg-btn[data-filter="expired"].active .n { background: var(--red-soft); color: var(--red); }

  /* ============ 批量操作条 ============ */
  .batchbar {
    display: none; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 14px; padding: 11px 16px;
    background: var(--red-soft); border: 1px solid rgba(255,92,92,.3); border-radius: var(--radius-sm);
    animation: riseIn .25s ease both;
  }
  .batchbar.show { display: flex; }
  .batchbar .count {
    font-family: var(--font-mono); font-size: 13px; color: var(--red); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .batchbar .spacer { flex: 1; }
  .batchbar .btn { padding: 8px 16px; font-size: 13px; }

  /* ============ 短链显示盘（表格） ============ */
  .board {
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
  }
  .board-scroll { overflow-x: auto; }
  .board-table { width: 100%; border-collapse: collapse; min-width: 900px; }
  .board-table th {
    padding: 12px 14px; text-align: left; font-family: var(--font-mono);
    font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint); background: var(--bg-inset);
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .board-table td {
    padding: 13px 14px; font-size: 13.5px; border-bottom: 1px solid var(--line);
    vertical-align: middle; color: var(--ink);
  }
  .board-table tbody tr { transition: background .15s ease; }
  .board-table tbody tr:hover { background: var(--bg-board); }
  .board-table tbody tr:last-child td { border-bottom: none; }
  .board-table tbody tr.selected { background: var(--amber-soft); }
  .board-table tbody tr.expired-row td { opacity: .72; }
  .board-table tbody tr.selected td { opacity: 1; }

  .code-tile {
    font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--amber);
    background: var(--bg-inset); border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 6px; cursor: pointer;
    transition: all .16s ease; display: inline-block;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.3);
  }
  .code-tile:hover { border-color: var(--amber); color: var(--ink); }

  .type-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    padding: 3px 9px; border-radius: 99px;
  }
  .type-pill svg { width: 11px; height: 11px; }
  .type-pill.url { background: var(--blue-soft); color: var(--blue); }
  .type-pill.text { background: var(--green-soft); color: var(--green); }

  .cell-content {
    max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink-dim); font-size: 13px;
  }

  .status-pill {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
    padding: 3px 10px 3px 8px; border-radius: 99px; white-space: nowrap;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .status-pill.active-pill { background: var(--green-soft); color: var(--green); }
  .status-pill.active-pill .dot { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .status-pill.expired-pill { background: var(--red-soft); color: var(--red); }
  .status-pill.expired-pill .dot { background: var(--red); }
  .status-pill .countdown { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; }

  .cell-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-dim); }
  .cell-date { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
  .cell-date.never { color: var(--ink-faint); letter-spacing: .1em; }

  .row-actions { display: flex; gap: 2px; }

  /* 复选框 */
  .cb {
    appearance: none; -webkit-appearance: none; width: 17px; height: 17px; cursor: pointer;
    border: 1.5px solid var(--line-strong); border-radius: 5px; background: var(--bg-inset);
    display: inline-grid; place-content: center; transition: all .15s ease; vertical-align: middle;
  }
  .cb::before {
    content: ''; width: 9px; height: 9px; transform: scale(0); transition: transform .12s ease;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    background: #14161A;
  }
  .cb:checked { background: var(--amber); border-color: var(--amber); }
  .cb:checked::before { transform: scale(1); }
  .cb:indeterminate { background: var(--amber); border-color: var(--amber); }
  .cb:indeterminate::before {
    clip-path: none; width: 8px; height: 2px; border-radius: 1px; transform: scale(1);
  }
  .cb-all { cursor: pointer; }

  /* ============ 手机端卡片 ============ */
  .card-list { display: none; }
  .lcard {
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 10px; animation: riseIn .3s ease both;
  }
  .lcard.selected { border-color: var(--amber); background: var(--amber-soft); }
  .lcard-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .lcard-head .code-tile { font-size: 14px; }
  .lcard-head .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .lcard-content {
    background: var(--bg-inset); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; color: var(--ink-dim); word-break: break-all;
    max-height: 64px; overflow: hidden; position: relative; margin-bottom: 12px;
    font-family: var(--font-mono);
  }
  .lcard-content.expanded { max-height: none; }
  .lcard-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-bottom: 12px;
    font-size: 11.5px; color: var(--ink-faint); font-family: var(--font-mono);
  }
  .lcard-meta span { color: var(--ink-dim); }
  .lcard-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .lcard-actions .btn { padding: 7px 12px; font-size: 12px; }
  /* PLACEHOLDER-CSS-3 */
  /* ============ 统计 ============ */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  .stat-tile {
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px 24px; transition: border-color .18s ease, transform .18s ease;
  }
  .stat-tile:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .stat-tile .label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px;
  }
  .stat-tile .value {
    font-family: var(--font-mono); font-size: 34px; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .stat-tile .hint { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
  .v-amber { color: var(--amber); } .v-green { color: var(--green); }
  .v-red { color: var(--red); } .v-blue { color: var(--blue); }

  /* ============ 空状态 ============ */
  .empty {
    text-align: center; padding: 70px 20px; color: var(--ink-faint);
  }
  .empty .glyph {
    font-family: var(--font-mono); font-size: 34px; color: var(--line-strong);
    letter-spacing: .3em; margin-bottom: 14px; font-weight: 700;
  }
  .empty p { font-size: 13.5px; }
  .empty .cta { margin-top: 18px; }

  /* ============ 模态框 ============ */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10,11,14,.72);
    backdrop-filter: blur(4px); align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg-raised); border: 1px solid var(--line-strong);
    border-radius: 18px; padding: 30px; max-width: 520px; width: 100%;
    max-height: 84vh; overflow-y: auto; box-shadow: var(--shadow-pop);
    animation: riseIn .3s cubic-bezier(.22,.9,.36,1) both;
  }
  .modal.wide { max-width: 620px; }
  .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .modal .modal-sub {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint);
    letter-spacing: .1em; margin-bottom: 20px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions .btn { flex: 1; }
  .text-preview {
    background: var(--bg-inset); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; color: var(--ink);
  }
  .qr-display {
    padding: 16px; background: #fff; border-radius: 12px; display: inline-block; margin: 18px 0;
  }
  .qr-link {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-dim);
    word-break: break-all; text-align: center;
  }
  .confirm-body { color: var(--ink-dim); font-size: 14px; line-height: 1.7; }
  .confirm-body strong { color: var(--red); font-family: var(--font-mono); }
  .confirm-list {
    margin: 14px 0 0; padding: 12px 14px; background: var(--bg-inset);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim);
    max-height: 130px; overflow-y: auto; line-height: 1.9; word-break: break-all;
  }

  /* ============ Toast ============ */
  .toast {
    position: fixed; bottom: 26px; right: 26px; z-index: 200;
    display: flex; align-items: center; gap: 10px;
    padding: 13px 18px; border-radius: 11px; font-size: 13.5px; font-weight: 600;
    background: var(--bg-raised); border: 1px solid var(--line-strong); color: var(--ink);
    box-shadow: var(--shadow-pop); opacity: 0; transform: translateY(16px);
    transition: opacity .28s ease, transform .28s ease; pointer-events: none; max-width: 88vw;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast .t-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .toast.error .t-dot { background: var(--red); }

  /* ============ 响应式 ============ */
  @media (max-width: 900px) {
    .summary-strip { grid-template-columns: repeat(2, 1fr); }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .form-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .app { padding: 0 16px 60px; }
    .topbar { padding: 18px 0 14px; }
    .clock { display: none; }
    .tabs { width: 100%; }
    .tab { flex: 1; text-align: center; padding: 9px 8px; }
    .panel-card { padding: 20px; }
    .type-switch { flex-direction: column; }
    .board { display: none; }
    .card-list { display: block; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .seg { width: 100%; }
    .seg-btn { flex: 1; justify-content: center; }
    .flap { width: 36px; height: 47px; font-size: 21px; }
    .stat-tile { padding: 18px; }
    .stat-tile .value { font-size: 26px; }
    .modal { padding: 22px; }
  }
  @media (max-width: 480px) {
    .lcard-meta { grid-template-columns: 1fr; }
    .flap { width: 30px; height: 40px; font-size: 17px; }
    .result-link { flex-direction: column; }
  }

  /* ============ 动效 ============ */
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); }
    50% { transform: translateX(4px); } 75% { transform: translateX(-2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
  }
  </style>
</head>

<div class="toast" id="toast" role="status"><span class="t-dot"></span><span id="toastMsg"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const API_BASE = '/api';
  const state = {
    type: 'text',
    links: [],
    filtered: [],
    statusFilter: 'all',   // all | active | expired
    keyword: '',
    selected: new Set(),
    expireMinutes: 60,
    text: '',
    qrUrl: ''
  };

  // ---------- 工具 ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  const isExpired = l => !!(l.expireAt && new Date(l.expireAt) < new Date());

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso), p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtCountdown(iso) {
    const ms = new Date(iso) - Date.now();
    if (ms <= 0) return null;
    const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000), p = n => String(n).padStart(2,'0');
    if (h >= 24) return `${Math.floor(h/24)}d ${h%24}h`;
    return `${p(h)}:${p(m)}:${p(s)}`;
  }

  function showToast(msg, type = 'ok') {
    const t = $('toast');
    $('toastMsg').textContent = msg;
    t.classList.toggle('error', type === 'error');
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  async function copyText0(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      if (btn) { const old = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => btn.textContent = old, 1500); }
      showToast('已复制到剪贴板');
    } catch (e) { showToast('复制失败', 'error'); }
  }

  // ---------- 主题 ----------
  const SUN = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    $('themeBtn').innerHTML = theme === 'light' ? MOON : SUN;
    localStorage.setItem('shorturl_theme', theme);
  }
  function toggleTheme() {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  }

  // ---------- 实时时钟（显示盘语义：时间驱动一切过期） ----------
  function tickClock() {
    const d = new Date(), p = n => String(n).padStart(2,'0');
    $('liveClock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  // ---------- 有效期选择 ----------
  function initExpireSelector() {
    document.querySelectorAll('#expireSelector .chip').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('#expireSelector .chip').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        if (el.dataset.custom === 'true') {
          $('expireCustom').classList.add('show');
          state.expireMinutes = null;
        } else {
          $('expireCustom').classList.remove('show');
          state.expireMinutes = parseInt(el.dataset.minutes);
        }
      });
    });
  }
  function getExpireHours() {
    const custom = document.querySelector('#expireSelector .chip[data-custom="true"]').classList.contains('active');
    if (custom) { const h = parseInt($('customExpireHours').value); return isNaN(h) ? 0 : h; }
    return state.expireMinutes === 0 ? 0 : state.expireMinutes / 60;
  }

  // ---------- 二维码 ----------
  function generateQR(containerId, url, size = 200) {
    const c = $(containerId); c.innerHTML = '';
    return new QRCode(c, { text: url, width: size, height: size, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  }
  function showQRModal(url) {
    state.qrUrl = url;
    $('qrLinkText').textContent = url;
    $('qrDisplay').innerHTML = '';
    generateQR('qrDisplay', url, 240);
    openModal('qrModal');
  }
  function downloadQR() {
    const canvas = document.querySelector('#qrDisplay canvas');
    if (canvas) { const a = document.createElement('a'); a.download = 'furl-qrcode.png'; a.href = canvas.toDataURL(); a.click(); }
  }

  // ---------- 认证 ----------
  function checkAuth() {
    if (localStorage.getItem('shorturl_token')) {
      $('loginScreen').style.display = 'none';
      $('panel').classList.add('active');
      loadLinks();
    }
  }
  async function doLogin() {
    const code = $('accessCode').value.trim();
    if (!code) { showLoginError('请输入访问码'); return; }
    try {
      const res = await fetch(`${API_BASE}/auth`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('shorturl_token', data.token);
        $('loginScreen').style.display = 'none';
        $('panel').classList.add('active');
        loadLinks();
      } else showLoginError(data.error || '访问码错误');
    } catch (e) { showToast('网络错误：' + e.message, 'error'); }
  }
  function showLoginError(msg) {
    const el = $('loginError');
    el.textContent = msg; el.classList.remove('show');
    void el.offsetWidth; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3200);
  }
  function doLogout() { localStorage.removeItem('shorturl_token'); location.reload(); }

  // ---------- 类型选择 ----------
  function selectType(type) {
    state.type = type;
    document.querySelectorAll('.type-opt').forEach(el => el.classList.remove('active'));
    $(`type-${type}`).classList.add('active');
    $('content').placeholder = type === 'text'
      ? '输入要分享的文本内容...'
      : '输入要跳转的 URL，如 https://example.com';
  }

  // ---------- 创建 ----------
  async function createLink() {
    const content = $('content').value.trim();
    if (!content) { showToast('请输入内容', 'error'); return; }
    if (state.type === 'url' && !/^https?:\/\//.test(content)) { showToast('URL 必须以 http:// 或 https:// 开头', 'error'); return; }

    try {
      const res = await fetch(`${API_BASE}/links`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('shorturl_token')}` },
        body: JSON.stringify({ type: state.type, content, customCode: $('customCode').value.trim() || null, expireHours: getExpireHours(), remark: $('remark').value.trim() })
      });
      const data = await res.json();
      if (res.ok) {
        showToast(`签发成功 · ${data.code}`);
        showCreateResult(data.code, data.shortUrl);
        $('content').value = ''; $('customCode').value = ''; $('remark').value = '';
        if ($('tab-list').classList.contains('active')) loadLinks();
      } else showToast(data.error || `创建失败（${res.status}）`, 'error');
    } catch (e) { showToast('创建失败：' + e.message, 'error'); }
  }

  // 签名交互：短码逐字翻牌揭晓
  function showCreateResult(code, url) {
    $('resultLink').value = url;
    generateQR('createQR', url, 170);
    const row = $('flapRow');
    row.innerHTML = '';
    [...code].forEach((ch, i) => {
      const flap = document.createElement('div');
      flap.className = 'flap';
      flap.textContent = ch;
      flap.style.animationDelay = `${i * 90}ms`;
      row.appendChild(flap);
    });
    $('createResult').classList.add('show');
  }
  function copyResultLink(btn) { copyText0($('resultLink').value, btn); }
  // ---------- 数据加载与筛选 ----------
  async function loadLinks() {
    try {
      const res = await fetch(`${API_BASE}/links`, { headers: { 'Authorization': `Bearer ${localStorage.getItem('shorturl_token')}` } });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { showToast('登录已过期，请重新登录', 'error'); doLogout(); }
        else showToast(data.error || `加载失败（${res.status}）`, 'error');
        return;
      }
      state.links = await res.json();
      state.selected.clear();
      applyFilter();
      renderStats();
    } catch (e) { showToast('加载数据失败：' + e.message, 'error'); }
  }

  function applyFilter() {
    const kw = state.keyword;
    state.filtered = state.links.filter(l => {
      if (state.statusFilter === 'active' && isExpired(l)) return false;
      if (state.statusFilter === 'expired' && !isExpired(l)) return false;
      if (kw) {
        const hay = `${l.code}\n${l.content}\n${l.remark || ''}`.toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });
    renderList();
  }

  function filterLinks() {
    state.keyword = $('searchInput').value.trim().toLowerCase();
    applyFilter();
  }
  function clearSearch() { $('searchInput').value = ''; state.keyword = ''; applyFilter(); }
  function setStatusFilter(f) {
    state.statusFilter = f;
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    const notes = { all: 'ALL DEPARTURES', active: 'ACTIVE ONLY', expired: 'EXPIRED · 可批量清理' };
    $('listNote').textContent = notes[f];
    applyFilter();
  }

  // ---------- 列表渲染 ----------
  function renderList() {
    const total = state.links.length;
    const expired = state.links.filter(isExpired).length;
    const active = total - expired;
    const urlCount = state.links.filter(l => l.type === 'url').length;

    $('cntAll').textContent = total;
    $('cntActive').textContent = active;
    $('cntExpired').textContent = expired;
    $('listStats').innerHTML = `
      <div class="sum-item"><span class="v">${total}</span><span class="k">总链接</span></div>
      <div class="sum-item"><span class="v green">${active}</span><span class="k">有效</span></div>
      <div class="sum-item"><span class="v red">${expired}</span><span class="k">已过期</span></div>
      <div class="sum-item"><span class="v">${urlCount}<span style="font-size:13px;color:var(--ink-faint)"> / ${total - urlCount}</span></span><span class="k">URL / 文本</span></div>`;

    const cleanBtn = $('cleanExpiredBtn');
    cleanBtn.style.display = expired > 0 ? '' : 'none';

    renderTable();
    renderCards();
    updateBatchbar();
  }

  function statusCellHTML(l) {
    if (isExpired(l)) return `<span class="status-pill expired-pill"><span class="dot"></span>已过期</span>`;
    if (!l.expireAt) return `<span class="status-pill active-pill"><span class="dot"></span>有效 · 永久</span>`;
    return `<span class="status-pill active-pill"><span class="dot"></span>有效 <span class="countdown" data-cd="${esc(l.expireAt)}">${fmtCountdown(l.expireAt) || '00:00:00'}</span></span>`;
  }

  function emptyHTML() {
    const inner = state.links.length === 0
      ? `<div class="glyph">-- -- --</div><p>板上还没有任何短码</p><div class="cta"><button class="btn btn-primary" onclick="switchTabTo('create')">去签发第一条</button></div>`
      : `<div class="glyph">[ · · · ]</div><p>没有符合当前筛选的结果${state.keyword ? ` · <a href="javascript:clearSearch()" style="color:var(--amber)">清除搜索</a>` : ''}</p>`;
    return `<div class="board"><div class="empty">${inner}</div></div>`;
  }

  function renderTable() {
    const body = $('tableBody');
    const wrap = $('boardWrap');
    if (state.filtered.length === 0) {
      body.innerHTML = '';
      wrap.style.display = 'none';
      $('tableEmpty').innerHTML = emptyHTML();
      $('cardList').innerHTML = window.matchMedia('(max-width: 768px)').matches ? emptyHTML() : '';
      return;
    }
    wrap.style.display = '';
    $('tableEmpty').innerHTML = '';
    const base = location.origin;
    body.innerHTML = state.filtered.map(l => {
      const url = `${base}/${l.code}`;
      const exp = isExpired(l);
      const preview = l.content.length > 46 ? l.content.slice(0, 46) + '…' : l.content;
      return `<tr class="${exp ? 'expired-row' : ''} ${state.selected.has(l.code) ? 'selected' : ''}" data-code="${esc(l.code)}">
        <td><input type="checkbox" class="cb row-cb" ${state.selected.has(l.code) ? 'checked' : ''} onchange="toggleSelect('${esc(l.code)}')" aria-label="选择 ${esc(l.code)}"></td>
        <td><span class="code-tile" onclick="window.open('${esc(url)}','_blank')" title="打开 ${esc(url)}">${esc(l.code)}</span></td>
        <td><span class="type-pill ${l.type}">${l.type === 'url'
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> URL'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="17" x2="17" y2="17"/></svg> 文本'}</span></td>
        <td><div class="cell-content" title="${esc(l.content)}${l.remark ? ` ｜ ${esc(l.remark)}` : ''}">${esc(preview)}</div></td>
        <td>${statusCellHTML(l)}</td>
        <td class="cell-num">${l.visits || 0}</td>
        <td class="cell-date">${fmtDate(l.createdAt)}</td>
        <td class="cell-date ${l.expireAt ? '' : 'never'}">${l.expireAt ? fmtDate(l.expireAt) : 'PERM'}</td>
        <td><div class="row-actions">
          <button class="icon-btn" title="复制链接" onclick="copyLink('${esc(url)}', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          <button class="icon-btn" title="二维码" onclick="showQRModal('${esc(url)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM21 14v.01M14 21v.01M17.5 17.5h.01M21 21h.01"/></svg></button>
          ${l.type === 'text' ? `<button class="icon-btn" title="预览文本" onclick="previewText('${esc(l.code)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>` : ''}
          <button class="icon-btn" title="编辑" onclick="openEdit('${esc(l.code)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>
          <button class="icon-btn danger" title="删除" onclick="confirmDeleteOne('${esc(l.code)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        </div></td>
      </tr>`;
    }).join('');

    const visible = state.filtered.map(l => l.code);
    const allSel = visible.length > 0 && visible.every(c => state.selected.has(c));
    const someSel = visible.some(c => state.selected.has(c));
    const cbAll = $('cbAll');
    cbAll.checked = allSel;
    cbAll.indeterminate = !allSel && someSel;
  }

  function renderCards() {
    const list = $('cardList');
    if (state.filtered.length === 0) { list.innerHTML = ''; return; }
    const base = location.origin;
    list.innerHTML = state.filtered.map(l => {
      const url = `${base}/${l.code}`;
      const exp = isExpired(l);
      const short = l.content.length > 80 ? l.content.slice(0, 80) + '…' : l.content;
      return `<div class="lcard ${state.selected.has(l.code) ? 'selected' : ''}">
        <div class="lcard-head">
          <input type="checkbox" class="cb" ${state.selected.has(l.code) ? 'checked' : ''} onchange="toggleSelect('${esc(l.code)}')" aria-label="选择 ${esc(l.code)}">
          <span class="code-tile" onclick="window.open('${esc(url)}','_blank')">${esc(l.code)}</span>
          <span class="right">${statusCellHTML(l)}</span>
        </div>
        <div class="lcard-content" onclick="this.classList.toggle('expanded')">${esc(short)}</div>
        <div class="lcard-meta">
          <div>类型 <span>${l.type === 'url' ? 'URL' : '文本'}</span></div>
          <div>访问 <span>${l.visits || 0}</span></div>
          <div>签发 <span>${fmtDate(l.createdAt)}</span></div>
          <div>失效 <span>${l.expireAt ? fmtDate(l.expireAt) : '永久'}</span></div>
        </div>
        <div class="lcard-actions">
          <button class="btn btn-ghost" onclick="copyLink('${esc(url)}', this)">复制</button>
          <button class="btn btn-ghost" onclick="showQRModal('${esc(url)}')">二维码</button>
          ${l.type === 'text' ? `<button class="btn btn-ghost" onclick="previewText('${esc(l.code)}')">预览</button>` : ''}
          <button class="btn btn-ghost" onclick="openEdit('${esc(l.code)}')">编辑</button>
          <button class="btn btn-danger-ghost" onclick="confirmDeleteOne('${esc(l.code)}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }

  // ---------- 多选与批量删除 ----------
  function toggleSelect(code) {
    state.selected.has(code) ? state.selected.delete(code) : state.selected.add(code);
    refreshSelectionUI();
  }
  function toggleSelectAll(cb) {
    const codes = state.filtered.map(l => l.code);
    cb.checked ? codes.forEach(c => state.selected.add(c)) : codes.forEach(c => state.selected.delete(c));
    refreshSelectionUI();
  }
  function selectAllVisible() {
    state.filtered.forEach(l => state.selected.add(l.code));
    refreshSelectionUI();
  }
  function clearSelection() { state.selected.clear(); refreshSelectionUI(); }
  function refreshSelectionUI() {
    renderTable(); renderCards(); updateBatchbar();
  }
  function updateBatchbar() {
    const n = state.selected.size;
    $('batchbar').classList.toggle('show', n > 0);
    $('selCount').textContent = n;
  }

  // 统一删除入口（单个 / 批量 / 清理过期）
  function askConfirm(title, sub, text, codes, okLabel) {
    $('confirmTitle').textContent = title;
    $('confirmSub').textContent = sub;
    $('confirmText').innerHTML = text;
    $('confirmList').innerHTML = codes.map(c => `<div>${esc(c)}</div>`).join('');
    $('confirmOkBtn').textContent = okLabel || '确认删除';
    $('confirmOkBtn').onclick = () => executeDelete(codes);
    openModal('confirmModal');
  }
  function confirmDeleteOne(code) {
    askConfirm('删除短链', `DELETE · ${code}`, `即将删除短码 <strong>${esc(code)}</strong>，访问记录将一并清除，此操作不可恢复。`, [code]);
  }
  function confirmDeleteSelected() {
    const codes = [...state.selected];
    askConfirm('批量删除', `DELETE × ${codes.length}`, `即将删除 <strong>${codes.length}</strong> 条短链，此操作不可恢复：`, codes, `删除 ${codes.length} 条`);
  }
  function confirmCleanExpired() {
    const codes = state.links.filter(isExpired).map(l => l.code);
    if (!codes.length) { showToast('没有已过期的链接', 'error'); return; }
    askConfirm('清理过期链接', `CLEANUP × ${codes.length}`, `即将删除全部 <strong>${codes.length}</strong> 条已过期短链，释放板上空间：`, codes, `清理 ${codes.length} 条`);
  }
  async function executeDelete(codes) {
    closeModal('confirmModal');
    try {
      const res = await fetch(`${API_BASE}/links`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('shorturl_token')}` },
        body: JSON.stringify({ codes })
      });
      const data = await res.json();
      if (res.ok) {
        showToast(`已删除 ${data.deleted} 条${data.deleted < data.requested ? `（${data.requested - data.deleted} 条不存在）` : ''}`);
        loadLinks();
      } else showToast(data.error || '删除失败', 'error');
    } catch (e) { showToast('删除失败：' + e.message, 'error'); }
  }

  function copyLink(url, btn) { copyText0(url, btn); }
  // ---------- 文本预览 / 编辑 / 统计 ----------
  function previewText(code) {
    const l = state.links.find(x => x.code === code);
    if (!l) return;
    state.text = l.content;
    $('textModalCode').textContent = `TEXT · ${code}`;
    $('textPreview').textContent = l.content;
    openModal('textModal');
  }
  function copyText() { copyText0(state.text); closeModal('textModal'); }

  function openEdit(code) {
    const l = state.links.find(x => x.code === code);
    if (!l) return;
    $('editCode').value = code;
    $('editCodeLabel').textContent = code;
    $('editContent').value = l.content;
    $('editExpire').value = l.expireHours || 0;
    $('editRemark').value = l.remark || '';
    openModal('editModal');
  }
  async function saveEdit() {
    const code = $('editCode').value;
    const content = $('editContent').value.trim();
    if (!content) { showToast('内容不能为空', 'error'); return; }
    try {
      const res = await fetch(`${API_BASE}/links`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('shorturl_token')}` },
        body: JSON.stringify({ code, content, expireHours: parseInt($('editExpire').value) || 0, remark: $('editRemark').value.trim() })
      });
      const data = await res.json();
      if (res.ok) { showToast('修改已保存'); closeModal('editModal'); loadLinks(); }
      else showToast(data.error || '修改失败', 'error');
    } catch (e) { showToast('修改失败：' + e.message, 'error'); }
  }

  function renderStats() {
    const ls = state.links;
    const total = ls.length;
    const urlCount = ls.filter(l => l.type === 'url').length;
    const totalVisits = ls.reduce((s, l) => s + (l.visits || 0), 0);
    const active = ls.filter(l => !isExpired(l)).length;
    const expired = total - active;
    const today = ls.filter(l => new Date(l.createdAt).toDateString() === new Date().toDateString()).length;
    const tile = (label, value, hint, cls = '') =>
      `<div class="stat-tile"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="hint">${hint}</div></div>`;
    $('statsGrid').innerHTML =
      tile('总链接数', total, `${urlCount} 条 URL · ${total - urlCount} 条文本`) +
      tile('总访问量', totalVisits, total ? `平均 ${Math.round(totalVisits / total)} 次/条` : '—') +
      tile('有效链接', active, '当前在飞的短码', 'v-green') +
      tile('已过期', expired, expired ? '可在列表页一键清理' : '板面干净', expired ? 'v-red' : '') +
      tile('今日签发', today, '过去 24 小时内', 'v-amber') +
      tile('URL 链接', urlCount, '302 跳转类', 'v-blue') +
      tile('文本链接', total - urlCount, '内容分享类', 'v-green') +
      tile('最长寿命', ls.some(l => !l.expireAt) ? '∞' : '—', ls.some(l => !l.expireAt) ? '存在永久链接' : '全部有时效', 'v-amber');
  }

  // ---------- 模态框 / 标签页 ----------
  function openModal(id) { $(id).classList.add('active'); }
  function closeModal(id) { $(id).classList.remove('active'); }
  document.querySelectorAll('.modal-overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('active'); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
  });

  function switchTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn = btn || document.querySelector('.tab[onclick*="' + tab + '"]');
    if (btn) btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    $(`tab-${tab}`).classList.add('active');
    if (tab === 'list' || tab === 'stats') loadLinks();
  }
  function switchTabTo(tab) { switchTab(tab); }

  // ---------- 倒计时每秒刷新（等宽字体，无抖动） ----------
  setInterval(() => {
    document.querySelectorAll('[data-cd]').forEach(el => {
      const t = fmtCountdown(el.dataset.cd);
      if (t) el.textContent = t;
      else if (el.dataset.cd) loadLinks();
    });
  }, 1000);

  // ---------- 初始化 ----------
  $('accessCode').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

  applyTheme(localStorage.getItem('shorturl_theme') === 'light' ? 'light' : 'dark');
  tickClock(); setInterval(tickClock, 1000);
  initExpireSelector();
  checkAuth();
  </script></body>
</html>
